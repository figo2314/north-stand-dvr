services:
  north-stand-dvr:
    build: .
    container_name: north-stand-dvr
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      TZ: Asia/Shanghai
    ports:
      - "4173:4173"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
    networks:
      - nsd
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  nsd:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:1::/64
